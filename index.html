<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Mini Jeux avec Authentification</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
    margin: 0;
    padding: 0;
  }
  header {
    background: #1e293b;
    padding: 20px;
    text-align: center;
  }
  h1 { margin: 0; color: orange; }
  nav { margin-top: 10px; }
  nav button {
    padding: 10px 20px;
    margin: 5px;
    border: none;
    border-radius: 10px;
    background: orange;
    color: #fff;
    font-size: 16px;
    cursor: pointer;
  }
  .tab { display: none; padding: 20px; }
  .tab.active { display: block; }
  .shell { display: none; } /* masqué tant que pas connecté */

  /* --- Authentification --- */
  .auth{
    position:fixed; inset:0; background:#0f172a;
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    gap:12px; z-index:9999;
  }
  .auth input, .auth button{
    padding:10px 14px; border-radius:10px; border:none;
  }
  .auth input{width:200px;}
  .auth button{background:orange; cursor:pointer;}
</style>
</head>
<body>

<!-- Boîte d’authentification -->
<div id="authBox" class="auth">
  <h2>🔑 Authentification</h2>
  <input type="password" id="authPass" placeholder="Mot de passe">
  <button id="authBtn">Entrer</button>
  <p id="authMsg"></p>
</div>

<!-- Contenu du site (masqué au début) -->
<div class="shell">
  <header>
    <h1>Mini Jeux 🎮</h1>
    <nav>
      <button onclick="openTab('morpion')">Morpion</button>
      <button onclick="openTab('memory')">Memory</button>
      <button onclick="openTab('guess')">Devinette</button>
    </nav>
  </header>

  <section id="morpion" class="tab active">
    <h2>Morpion</h2>
    <table id="board"></table>
    <p id="status"></p>
  </section>

  <section id="memory" class="tab">
    <h2>Memory</h2>
    <div id="memoryGame"></div>
  </section>

  <section id="guess" class="tab">
    <h2>Devinette</h2>
    <p>Devine un nombre entre 1 et 10</p>
    <input type="number" id="guessInput" min="1" max="10">
    <button onclick="checkGuess()">Vérifier</button>
    <p id="guessResult"></p>
  </section>
</div>

<script>
// --- Authentification ---
const authBox = document.getElementById("authBox");
const authBtn = document.getElementById("authBtn");
const authPass = document.getElementById("authPass");
const authMsg = document.getElementById("authMsg");
const shell = document.querySelector(".shell");

let savedPass = localStorage.getItem("gamePass");

authBtn.addEventListener("click", ()=>{
  const val = authPass.value.trim();
  if(!val){
    authMsg.textContent = "Entrez un mot de passe.";
    return;
  }
  if(!savedPass){
    localStorage.setItem("gamePass", val);
    savedPass = val;
    authMsg.textContent = "✅ Mot de passe créé. Bienvenue !";
    openSite();
  }else{
    if(val === savedPass){
      authMsg.textContent = "✅ Connexion réussie.";
      openSite();
    }else{
      authMsg.textContent = "❌ Mot de passe incorrect.";
    }
  }
});

function openSite(){
  authBox.style.display="none";
  shell.style.display="block";
}

// --- Tabs ---
function openTab(tabId) {
  document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
  document.getElementById(tabId).classList.add('active');
}

// --- Jeu du Morpion ---
const board = document.getElementById("board");
const statusText = document.getElementById("status");
let currentPlayer = "X";

function initBoard() {
  board.innerHTML = "";
  for(let i=0;i<3;i++){
    let row = board.insertRow();
    for(let j=0;j<3;j++){
      let cell = row.insertCell();
      cell.addEventListener("click", ()=>makeMove(cell));
    }
  }
}
function makeMove(cell){
  if(cell.textContent===""){
    cell.textContent = currentPlayer;
    if(checkWinner()){
      statusText.textContent = currentPlayer+" a gagné!";
    } else {
      currentPlayer = currentPlayer==="X"?"O":"X";
    }
  }
}
function checkWinner(){
  const cells = board.getElementsByTagName("td");
  const lines = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];
  return lines.some(line => 
    cells[line[0]].textContent &&
    cells[line[0]].textContent === cells[line[1]].textContent &&
    cells[line[1]].textContent === cells[line[2]].textContent
  );
}
initBoard();

// --- Jeu Memory ---
const memoryGame = document.getElementById("memoryGame");
const cardsArray = ["🍎","🍌","🍇","🍎","🍌","🍇"];
let firstCard, secondCard;
function initMemory(){
  memoryGame.innerHTML="";
  let cards = [...cardsArray].sort(()=>0.5-Math.random());
  cards.forEach(symbol=>{
    let card=document.createElement("div");
    card.textContent="?";
    card.style.display="inline-block";
    card.style.width="50px";
    card.style.height="50px";
    card.style.border="1px solid #fff";
    card.style.margin="5px";
    card.style.textAlign="center";
    card.style.lineHeight="50px";
    card.style.fontSize="24px";
    card.style.cursor="pointer";
    card.dataset.symbol=symbol;
    card.addEventListener("click", ()=>flipCard(card));
    memoryGame.appendChild(card);
  });
}
function flipCard(card){
  if(!firstCard){
    firstCard=card;
    card.textContent=card.dataset.symbol;
  }else if(!secondCard && card!==firstCard){
    secondCard=card;
    card.textContent=card.dataset.symbol;
    if(firstCard.dataset.symbol===secondCard.dataset.symbol){
      firstCard=null; secondCard=null;
    }else{
      setTimeout(()=>{
        firstCard.textContent="?";
        secondCard.textContent="?";
        firstCard=null; secondCard=null;
      },1000);
    }
  }
}
initMemory();

// --- Jeu Devinette ---
let secretNumber = Math.floor(Math.random()*10)+1;
function checkGuess(){
  const guess = parseInt(document.getElementById("guessInput").value);
  if(guess===secretNumber){
    document.getElementById("guessResult").textContent="✅ Bravo!";
  }else{
    document.getElementById("guessResult").textContent="❌ Raté, essaie encore.";
  }
}
</script>

</body>
</html>
